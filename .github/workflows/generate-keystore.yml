name: Generate Aira Release Keystore

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Generate Keystore
        run: |
          keytool -genkeypair \
            -v \
            -keystore aira-release.keystore \
            -alias aira \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass 'AiraRelease2026!' \
            -keypass 'AiraRelease2026!' \
            -dname "CN=Aira AI, OU=Aira, O=Aira, L=Tehran, ST=Tehran, C=IR"

      - name: Verify Keystore
        run: |
          keytool -list \
            -v \
            -keystore aira-release.keystore \
            -storepass 'AiraRelease2026!'

      - name: Upload Keystore
        uses: actions/upload-artifact@v4
        with:
          name: aira-release-keystore
          path: aira-release.keystore
