name: Build Android APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build Web App
        run: npm run build

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build APK with Gradle
        run: |
          cd android
          ./gradlew assembleRelease

      - name: Find Release APK
        run: |
          echo "🔎 Searching for Release APK..."

          find android/app/build/outputs/apk -type f -name "*.apk" -print

          APK=$(find android/app/build/outputs/apk/release -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "❌ Release APK پیدا نشد"
            exit 1
          fi

          echo "✅ Release APK found:"
          echo "$APK"

          cp "$APK" app-release.apk

      - name: Verify APK
        run: |
          echo "🔐 Verifying APK..."

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)

          if [ -z "$APKSIGNER" ]; then
            echo "❌ apksigner پیدا نشد"
            exit 1
          fi

          "$APKSIGNER" verify --verbose app-release.apk

          echo "✅ APK signature verified successfully"

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app-release.apk
          if-no-files-found: error
