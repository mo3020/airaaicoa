name: Build Android APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build Web App
        run: npm run build

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Check Release Keystore
        run: |
          if [ ! -f "android/aira-release.keystore" ]; then
            echo "❌ aira-release.keystore پیدا نشد"
            echo "📁 باید فایل در مسیر android/aira-release.keystore قرار داشته باشد"
            exit 1
          fi

          echo "✅ Release keystore found"

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build Release APK
        run: |
          cd android

          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/android/aira-release.keystore" \
            -Pandroid.injected.signing.store.password="AiraRelease2026!" \
            -Pandroid.injected.signing.key.alias="aira" \
            -Pandroid.injected.signing.key.password="AiraRelease2026!"

      - name: Find Release APK
        run: |
          echo "🔎 Searching for Release APK..."

          find android/app/build/outputs/apk/release \
            -type f \
            -name "*.apk" \
            -print

          APK=$(find android/app/build/outputs/apk/release \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "❌ Release APK پیدا نشد"
            exit 1
          fi

          echo "✅ Release APK found:"
          echo "$APK"

          cp "$APK" app-release.apk

      - name: Verify APK Signature
        run: |
          echo "🔐 Verifying APK..."

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" \
            -name "apksigner" \
            | sort -V \
            | tail -n 1)

          if [ -z "$APKSIGNER" ]; then
            echo "❌ apksigner پیدا نشد"
            exit 1
          fi

          "$APKSIGNER" verify --verbose app-release.apk

          echo "======================================"
          echo "✅ APK SIGNATURE VERIFIED"
          echo "======================================"

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app-release.apk
          if-no-files-found: error
